server:
  port: 8080

spring:
  datasource:                       # MySQL: accounts and credentials only
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/taskhub_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
  data:
    mongodb:                        # MongoDB: teams, projects, tasks
      uri: ${MONGO_URI:mongodb://localhost:27017/taskhub}

app:
  jwt-secret: ${JWT_SECRET:change-me-to-a-long-random-string-of-at-least-32-chars}
  jwt-expiry-hours: 24
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
